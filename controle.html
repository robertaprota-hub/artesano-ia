<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Controle da votação · Hackathon Artesano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F1EC;--surface:#fff;--ink:#02394A;--muted:#5B6867;--line:#DAD6CC;
  --ok:#1F7A4D;--ok-bg:#E3F0E8;--bad:#B3261E;--bad-bg:#F8E3E0;--com:#02394A;--com-bg:#DCE9EC;--warn:#9A5B00;--warn-bg:#FBEEDD}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-size:17px;line-height:1.35;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:18px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.02em}
.estado{border-radius:16px;padding:22px 20px;text-align:center;font-weight:700;font-size:30px;line-height:1.1;letter-spacing:.02em;text-wrap:balance}
.estado small{display:block;font-size:15px;font-weight:500;margin-top:8px;letter-spacing:0}
.estado.geral{background:var(--ok);color:#fff}
.estado.comite{background:var(--com);color:#fff}
.estado.fechado{background:var(--bad-bg);color:var(--bad)}
.estado.espera{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.bts{display:flex;flex-direction:column;gap:12px}
.bt{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px;width:100%;min-height:104px;padding:14px 18px;
  border-radius:16px;border:3px solid var(--c);background:var(--surface);color:var(--c);font:inherit;font-weight:700;font-size:25px;
  text-align:left;cursor:pointer;line-height:1.1}
.bt .n{width:54px;height:54px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:26px}
.bt .tag{font-size:13px;letter-spacing:.08em;padding:5px 10px;border-radius:999px;background:#fff;color:var(--c)}
.bt.ativo{background:var(--c);color:#fff}
.bt.ativo .n{background:#fff;color:var(--c)}
.bt:disabled{opacity:.55;cursor:wait}
.bt:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #E0A93B;outline-offset:3px}
.b1{--c:var(--ok)} .b2{--c:var(--bad)} .b3{--c:var(--com)}
.msg{border-radius:12px;padding:12px 16px;font-weight:500}
.msg.erro{background:var(--bad-bg);color:var(--bad)} .msg.aviso{background:var(--warn-bg);color:var(--warn)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.num b{display:block;font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.num span{color:var(--muted);font-size:15px}
.num.alerta b{color:var(--bad)}
.fin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fin h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fin ol{margin:0;padding-left:24px;font-size:20px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.fin p{margin:0;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a,.links button{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--ink);
  border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}
.pin{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.pin label{font-weight:600}
.pin input{font:inherit;font-size:28px;letter-spacing:.3em;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;width:100%}
.pin button{font:inherit;font-weight:600;background:var(--ink);color:#fff;font-size:18px;padding:14px;border:0;border-radius:10px;cursor:pointer}
.hora{color:var(--muted);font-size:14px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hackathon IA Artesano · controle da votação</h1>

  <form id="pinBox" class="pin" hidden>
    <label for="pin">PIN da organizadora</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <button type="submit">Entrar</button>
    <div id="pinErro" class="msg erro" hidden></div>
  </form>

  <div id="painel" class="wrap" hidden>
    <div id="estado" class="estado espera">Conferindo…</div>
    <div id="msg" class="msg erro" hidden></div>

    <div class="bts">
      <button type="button" class="bt b1" id="b1" data-fase="geral_abrir"><span class="n">1</span><span>Abrir voto geral</span><span class="tag" hidden>AGORA</span></button>
      <button type="button" class="bt b2" id="b2" data-fase="geral_fechar"><span class="n">2</span><span>Fechar voto geral</span><span class="tag" hidden>AGORA</span></button>
      <button type="button" class="bt b3" id="b3" data-fase="comite_abrir"><span class="n">3</span><span>Abrir voto do comitê</span><span class="tag" hidden>AGORA</span></button>
    </div>

    <div class="nums">
      <div class="num"><b id="nVal">–</b><span>votos válidos</span></div>
      <div class="num" id="nAlBox"><b id="nAl">–</b><span>alertas altos</span></div>
    </div>

    <div class="fin">
      <h2 id="finTit">Finalistas</h2>
      <div id="fin"><p>Aparecem aqui quando chegarem os votos.</p></div>
    </div>

    <div class="links">
      <a href="https://claude.ai/artifact/PQnawm1P2GRQT6Dpe5e4s1" target="_blank" rel="noopener">Ver apuração completa</a>
      <a href="https://docs.google.com/spreadsheets/d/1d2Ns3dy7Rw7PlPfJ395k4YDF7r8d0iMObEe-kSAGEmE/edit#gid=1802177507" target="_blank" rel="noopener">Abrir planilha</a>
      <button type="button" id="sair">Trocar PIN</button>
    </div>
    <div id="hora" class="hora"></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwFbpnZZlhOoy8xvkJwEwGfzwAu_kUiUmsjMlxTLVsKGzp59kG6WgRej43x8Q9rTpf1/exec';
const KEY = 'artesano-ia:controle:pin';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let PIN = ''; try { PIN = localStorage.getItem(KEY) || ''; } catch (e) {}
let ocupado = false, ultimo = null, confirmar = null;

async function chama(fase) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ acao: 'vot_admin_fase', pin: PIN, fase }) });
  return r.json();
}
function msg(t, tipo) { const m = $('msg'); m.hidden = !t; m.className = 'msg ' + (tipo || 'erro'); m.textContent = t || ''; }

function pinta(j) {
  ultimo = j;
  const e = $('estado');
  if (j.geral) { e.className = 'estado geral'; e.innerHTML = 'VOTO GERAL ABERTO<small>Os participantes já podem enviar o pódio.</small>'; }
  else if (j.comite) { e.className = 'estado comite'; e.innerHTML = 'VOTO DO COMITÊ ABERTO<small>O comitê vê só os finalistas e dá as notas.</small>'; }
  else { e.className = 'estado fechado'; e.innerHTML = 'TUDO FECHADO<small>Ninguém consegue enviar o pódio agora.</small>'; }
  const ativo = j.geral ? 'b1' : j.comite ? 'b3' : 'b2';
  ['b1', 'b2', 'b3'].forEach(b => { $(b).classList.toggle('ativo', b === ativo); $(b).querySelector('.tag').hidden = b !== ativo; });
  $('nVal').textContent = j.validos;
  $('nAl').textContent = j.alertas_altos; $('nAlBox').classList.toggle('alerta', j.alertas_altos > 0);
  const f = j.finalistas || [];
  $('finTit').textContent = j.geral ? 'Na frente agora (parcial)' : 'Finalistas que vão ao comitê';
  $('fin').innerHTML = f.length ? '<ol>' + f.map(n => `<li>${esc(n)}</li>`).join('') + '</ol>' : '<p>Aparecem aqui quando chegarem os votos.</p>';
  $('hora').textContent = 'Atualizado às ' + (j.hora || '');
}

async function atualiza() {
  if (ocupado || !PIN) return;
  try { const j = await chama('ver'); if (j.ok) { pinta(j); if ($('msg').className.includes('erro')) msg(''); } else trataErro(j); }
  catch (e) { msg('Sem conexão com a planilha. Os botões podem não responder. Tento de novo sozinho.'); }
}
function trataErro(j) {
  if (/PIN/i.test(j.erro || '')) { sai('PIN incorreto.'); return; }
  if (/desconhecida/i.test(j.erro || '')) { msg('O script da planilha ainda não foi implantado. Clique em Implantar no Apps Script e recarregue esta página.'); return; }
  msg(j.erro || 'A planilha recusou o comando.');
}

document.querySelectorAll('.bt').forEach(bt => bt.addEventListener('click', async () => {
  if (ocupado) return;
  const fase = bt.dataset.fase;
  /* voltar do comitê para o voto geral pede um segundo toque */
  if (fase === 'geral_abrir' && ultimo && ultimo.comite && confirmar !== fase) {
    confirmar = fase; msg('O voto do comitê está aberto. Toque de novo em "Abrir voto geral" para voltar à etapa 1.', 'aviso'); return;
  }
  confirmar = null; ocupado = true; msg('');
  const rot = bt.children[1], antes = rot.textContent; rot.textContent = 'Enviando…';
  document.querySelectorAll('.bt').forEach(b => b.disabled = true);
  try { const j = await chama(fase); if (j.ok) pinta(j); else trataErro(j); }
  catch (e) { msg('Não consegui falar com a planilha. Confira a internet e toque de novo.'); }
  rot.textContent = antes; document.querySelectorAll('.bt').forEach(b => b.disabled = false); ocupado = false;
}));

function entra() { $('pinBox').hidden = true; $('painel').hidden = false; atualiza(); }
function sai(erro) {
  PIN = ''; try { localStorage.removeItem(KEY); } catch (e) {}
  $('painel').hidden = true; $('pinBox').hidden = false; $('pin').value = '';
  $('pinErro').hidden = !erro; $('pinErro').textContent = erro || '';
}
$('pinBox').addEventListener('submit', async ev => {
  ev.preventDefault(); PIN = $('pin').value.trim(); if (!PIN) return;
  const pe = $('pinErro'); pe.hidden = true;
  try {
    const j = await chama('ver');
    if (j.ok) { try { localStorage.setItem(KEY, PIN); } catch (e) {} $('pinBox').hidden = true; $('painel').hidden = false; pinta(j); return; }
    pe.textContent = /desconhecida/i.test(j.erro || '') ? 'O script da planilha ainda não foi implantado. Clique em Implantar no Apps Script e tente de novo.' : (j.erro || 'PIN incorreto.');
  } catch (e) { pe.textContent = 'Sem conexão com a planilha. Tente de novo.'; }
  pe.hidden = false; PIN = '';
});
$('sair').addEventListener('click', () => sai(''));
setInterval(() => { if (!document.hidden) atualiza(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualiza(); });
if (PIN) entra(); else $('pinBox').hidden = false;
</script>
</body>
</html>
